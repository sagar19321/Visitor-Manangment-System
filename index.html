<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
<meta name="theme-color" content="#0B1E3D" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="format-detection" content="telephone=no" />
<title>Poona Rent A Cab Pvt. Ltd. — Visitor Management System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
  #root { height: 100vh; height: 100dvh; }
  body { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  ::-webkit-scrollbar { width: 8px; height: 8px; }
  ::-webkit-scrollbar-thumb { background: #D5DCEA; border-radius: 8px; }
  select { font-family: inherit; }
  button:focus-visible, input:focus-visible, select:focus-visible {
    outline: 2px solid #1E4FD9; outline-offset: 1px;
  }
  button { font-family: inherit; }

  /* ===== LOGIN PAGE ANIMATIONS ===== */
  @keyframes fadeSlideUp {
    from { opacity: 0; transform: translateY(32px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn {
    from { opacity: 0; } to { opacity: 1; }
  }
  @keyframes floatOrb {
    0%,100% { transform: translateY(0px) scale(1); }
    50%      { transform: translateY(-28px) scale(1.04); }
  }
  @keyframes floatOrb2 {
    0%,100% { transform: translateY(0px) scale(1); }
    50%      { transform: translateY(22px) scale(0.97); }
  }
  @keyframes shimmer {
    0%   { background-position: -400px 0; }
    100% { background-position: 400px 0; }
  }
  @keyframes pulseRing {
    0%   { transform: scale(1);   opacity: 0.6; }
    70%  { transform: scale(1.6); opacity: 0; }
    100% { transform: scale(1.6); opacity: 0; }
  }
  @keyframes scanLine {
    0%   { top: 0%; opacity: 0.7; }
    50%  { opacity: 1; }
    100% { top: 100%; opacity: 0.7; }
  }
  @keyframes tickerScroll {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  @keyframes dotBlink {
    0%,100% { opacity: 0.3; transform: scale(0.8); }
    50%      { opacity: 1;   transform: scale(1.2); }
  }
  @keyframes cardEntrance {
    from { opacity: 0; transform: translateY(20px) scale(0.97); }
    to   { opacity: 1; transform: translateY(0) scale(1); }
  }
  @keyframes logoSpin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }
  @keyframes inputFocusGlow {
    from { box-shadow: 0 0 0 0 rgba(30,79,217,0.4); }
    to   { box-shadow: 0 0 0 6px rgba(30,79,217,0); }
  }

  .login-orb1 { animation: floatOrb 7s ease-in-out infinite; }
  .login-orb2 { animation: floatOrb2 9s ease-in-out infinite; }
  .login-orb3 { animation: floatOrb 11s ease-in-out infinite 2s; }
  .login-panel { animation: cardEntrance 0.6s cubic-bezier(0.34,1.2,0.64,1) both; }
  .login-header { animation: fadeSlideUp 0.5s ease both; }
  .choose-card { animation: cardEntrance 0.55s cubic-bezier(0.34,1.2,0.64,1) both; }
  .admin-card  { animation: cardEntrance 0.45s cubic-bezier(0.34,1.2,0.64,1) both; }

  .role-btn {
    transition: all 0.2s cubic-bezier(0.34,1.2,0.64,1) !important;
  }
  .role-btn:hover {
    transform: translateY(-2px) scale(1.01) !important;
    box-shadow: 0 12px 30px -8px rgba(11,30,61,0.18) !important;
    border-color: #1E4FD9 !important;
  }
  .role-btn:active {
    transform: scale(0.98) !important;
  }

  .login-submit-btn {
    transition: all 0.18s ease !important;
    position: relative;
    overflow: hidden;
  }
  .login-submit-btn::after {
    content: "";
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.18) 0%, transparent 60%);
    pointer-events: none;
  }
  .login-submit-btn:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 16px 36px -8px rgba(30,79,217,0.6) !important;
  }
  .login-submit-btn:active { transform: translateY(0) scale(0.98) !important; }

  .scan-line {
    position: absolute; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent, rgba(79,143,255,0.8), transparent);
    animation: scanLine 2.5s linear infinite;
    pointer-events: none;
  }

  .ticker-track { display: flex; animation: tickerScroll 22s linear infinite; }

  .live-dot { display: inline-block; border-radius: 50%; }
  .live-dot:nth-child(1) { animation: dotBlink 1.2s ease-in-out infinite 0s; }
  .live-dot:nth-child(2) { animation: dotBlink 1.2s ease-in-out infinite 0.2s; }
  .live-dot:nth-child(3) { animation: dotBlink 1.2s ease-in-out infinite 0.4s; }

  .login-input-wrap input:focus {
    border-color: #1E4FD9 !important;
    box-shadow: 0 0 0 3px rgba(30,79,217,0.12) !important;
    background: #fff !important;
  }

  .pulse-ring {
    position: absolute; inset: -6px; border-radius: 50%;
    border: 2px solid rgba(31,157,109,0.5);
    animation: pulseRing 2s ease-out infinite;
  }

  .reception-img-wrap {
    position: relative; overflow: hidden; border-radius: 20px;
  }
  .reception-img-wrap::after {
    content: ""; position: absolute; inset: 0;
    background: linear-gradient(0deg, rgba(11,30,61,0.55) 0%, transparent 55%);
    pointer-events: none;
  }

  /* ===== RESPONSIVE ===== */

  /* Login grid: two-col → one-col on mobile */
  .login-grid {
    display: grid;
    grid-template-columns: 1fr 420px;
    gap: 40px;
    align-items: center;
    width: 100%;
    max-width: 980px;
  }
  @media (max-width: 767px) {
    .login-grid {
      grid-template-columns: 1fr !important;
      gap: 0 !important;
      max-width: 440px !important;
    }
    .login-left-panel { display: none !important; }

    /* Allow scrolling on login on short mobile screens */
    body { overflow: auto !important; height: auto !important; }
    html { overflow: auto !important; height: auto !important; }
    #root { height: auto !important; min-height: 100dvh; }
  }

  /* Visit row responsive — hide type/host on mobile */
  @media (max-width: 640px) {
    .visit-row-grid {
      grid-template-columns: auto 1fr auto auto !important;
      gap: 8px !important;
      padding: 11px 12px !important;
    }
    .visit-col-type { display: none !important; }
    .visit-col-host { display: none !important; }
  }

  /* Search/filter bar stacks on mobile */
  @media (max-width: 600px) {
    .search-bar-wrap { flex-direction: column !important; }
    .search-bar-wrap > * { width: 100% !important; max-width: 100% !important; }
  }

  /* Receptionist header wraps on mobile */
  @media (max-width: 520px) {
    .rec-header-buttons { flex-wrap: wrap !important; gap: 6px !important; }
    .rec-header-btn { font-size: 0.73rem !important; padding: 7px 10px !important; }
  }

  /* =====================================================================
     ADMIN BI DASHBOARD — responsive grid system + animations
     Desktop → tablet → mobile, all pure CSS so charts reflow without JS.
     ===================================================================== */
  @keyframes biFadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes dashFadeIn {
    from { opacity: 0; }
    to   { opacity: 1; }
  }
  @keyframes sliceIn {
    from { opacity: 0; transform: scale(0.82); }
    to   { opacity: 1; transform: scale(1); }
  }

  .bi-root > * { animation: biFadeUp 0.4s ease both; }
  .bi-root > *:nth-child(2) { animation-delay: 0.04s; }
  .bi-root > *:nth-child(3) { animation-delay: 0.08s; }
  .bi-root > *:nth-child(4) { animation-delay: 0.12s; }
  .bi-root > *:nth-child(5) { animation-delay: 0.16s; }
  .bi-root > *:nth-child(6) { animation-delay: 0.20s; }
  .bi-root > *:nth-child(7) { animation-delay: 0.24s; }

  /* KPI cards: 4 across on desktop, 3 on small desktop, 2 on tablet/mobile */
  .bi-kpi-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 14px;
    margin-bottom: 16px;
  }
  @media (max-width: 1180px) { .bi-kpi-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  @media (max-width: 860px)  { .bi-kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 11px; } }
  @media (max-width: 420px)  { .bi-kpi-grid { gap: 9px; margin-bottom: 12px; } }

  .bi-kpi:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 26px -14px rgba(11,30,61,0.28);
  }

  /* Panel rows */
  .bi-row { display: grid; grid-template-columns: 1fr; gap: 14px; margin-bottom: 14px; min-width: 0; }
  .bi-row-2-1 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  .bi-row-1-1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  @media (max-width: 1024px) {
    .bi-row-2-1, .bi-row-1-1 { grid-template-columns: 1fr; }
  }

  /* Filter bar controls wrap cleanly at every width */
  .bi-filter-row { display: flex; gap: 9px; flex-wrap: wrap; align-items: center; }
  @media (max-width: 560px) {
    .bi-filter-row > * { flex: 1 1 100% !important; }
  }

  .bi-export:hover { filter: brightness(1.06); }
  .bi-activity { transition: background 0.15s; }
  .bi-activity:hover { background: #FAFBFD; }

  /* Respect users who prefer no motion */
  @media (prefers-reduced-motion: reduce) {
    .bi-root > *, .bi-root * { animation: none !important; transition: none !important; }
  }

  /* =====================================================================
     SELF-SERVICE MODULE — MOBILE-FIRST RESPONSIVE STYLES
     Optimised for smartphones & tablets and future Android APK packaging.
     ===================================================================== */

  /* The self-service pages own their scrolling (root is fixed height by default). */
  .ss-root {
    height: 100vh;
    height: 100dvh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;   /* momentum scroll on iOS */
    overscroll-behavior-y: contain;
  }

  /* Safe-area aware header (handles notches / camera cut-outs on phones). */
  .ss-header {
    padding-top: calc(env(safe-area-inset-top, 0px) + 22px) !important;
    padding-left: calc(env(safe-area-inset-left, 0px) + 20px) !important;
    padding-right: calc(env(safe-area-inset-right, 0px) + 20px) !important;
  }

  /* Sticky action bar sits above the home-indicator / gesture area. */
  .ss-actionbar {
    padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 14px) !important;
    padding-left: calc(env(safe-area-inset-left, 0px) + 16px) !important;
    padding-right: calc(env(safe-area-inset-right, 0px) + 16px) !important;
  }

  /* Give the scroll content enough bottom room so the fixed bar never covers it. */
  .ss-scroll-pad { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 108px) !important; }

  /* Prevent iOS auto-zoom on focus: inputs must be >= 16px. Touch-friendly sizing. */
  .ss-root input,
  .ss-root select,
  .ss-root textarea {
    font-size: 16px !important;
    min-height: 48px;                    /* comfortable tap target */
  }
  .ss-root textarea { min-height: 88px; }

  /* All tappable controls in self-service get a min 44px hit area. */
  .ss-root button { min-height: 44px; touch-action: manipulation; }

  /* Remove tap highlight flash, keep taps snappy. */
  .ss-root, .ss-root * { -webkit-tap-highlight-color: rgba(30,79,217,0.12); }

  /* Visitor-category chooser: responsive grid that reflows by width. */
  .ss-type-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(96px, 1fr));
    gap: 8px;
  }
  @media (max-width: 380px) {
    .ss-type-grid { grid-template-columns: repeat(2, 1fr); }
  }

  /* Two-column field rows collapse to one column on phones. */
  .ss-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 640px) { .ss-grid { grid-template-columns: 1fr; gap: 12px; } }

  /* Photo capture action buttons: side-by-side on wide, stacked on very narrow. */
  .ss-photo-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .ss-photo-actions > * { flex: 1 1 140px; }
  @media (max-width: 360px) { .ss-photo-actions > * { flex: 1 1 100%; } }

  /* ---- Admin QR panel: stack QR above link+actions on smaller screens ---- */
  .ss-qr-grid {
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 24px;
    align-items: center;
  }
  .ss-qr-actions { display: flex; gap: 10px; flex-wrap: wrap; }
  .ss-qr-actions > button { flex: 1 1 auto; }
  @media (max-width: 700px) {
    .ss-qr-grid {
      grid-template-columns: 1fr !important;
      justify-items: center;
      gap: 18px !important;
    }
    .ss-qr-right { width: 100%; min-width: 0 !important; }
    .ss-qr-actions > button { flex: 1 1 100%; }
  }

  /* Larger, thumb-friendly primary submit on phones. */
  @media (max-width: 640px) {
    .ss-submit-btn { padding: 16px 22px !important; font-size: 1rem !important; }
  }

</style>
</head>
<body>
<div id="root"></div>

/* --- Responsive hook --- */
function useWindowWidth() {
  const [w, setW] = useState(typeof window !== "undefined" ? window.innerWidth : 1200);
  useEffect(() => {
    const h = () => setW(window.innerWidth);
    window.addEventListener("resize", h);
    return () => window.removeEventListener("resize", h);
  }, []);
  return w;
}

/* ---------- IST Time Helper ---------- */
function toISO_IST(date) {
  const pad = n => String(n).padStart(2, '0');
  const ist = new Date(date.getTime() + 5.5 * 3600000);
  return `${ist.getUTCFullYear()}-${pad(ist.getUTCMonth() + 1)}-${pad(ist.getUTCDate())} ${pad(ist.getUTCHours())}:${pad(ist.getUTCMinutes())}:${pad(ist.getUTCSeconds())} IST`;
}

/* ---------- Admin credentials (Sheet-based) ---------- */
async function loadAdminCreds() {
  try {
    const data = await apiGet("adminCreds");
    if (Array.isArray(data) && data.length > 0 && data[0].password) return data[0];
  } catch (e) {}
  return {
    email: "admin@poonatravels.com",
    password: "admin123"
  };
}

/* ---------- Reception accounts (Sheet-based) ---------- */
async function loadReceptionAccounts() {
  try {
    const data = await apiGet("receptionAccounts");
    if (Array.isArray(data) && data.length > 0) return data;
  } catch (e) {}
  return [{
    id: "rec_default",
    name: "Reception",
    password: "reception123",
    email: "reception@company.com",
    createdAt: new Date().toISOString()
  }];
}
async function checkReceptionLogin(inputId, inputPw) {
  const accounts = await loadReceptionAccounts();
  return accounts.find(a => a.name.trim().toLowerCase() === inputId.trim().toLowerCase() && String(a.password).trim() === String(inputPw).trim()) || null;
}

function buildSelfServiceURL() {
  try {
    const u = new URL(window.location.href);
    u.hash = "";
    u.searchParams.set("selfservice", "1");
    return u.toString();
  } catch (e) {
    const base = window.location.origin + window.location.pathname;
    return base + "?selfservice=1";
  }
}

      if (statusFilter === "completed" && v.status !== "checked-out") return false;
      if (statusFilter === "rejected" && !v._rejected) return false;
      if (statusFilter === "pending" && !(v.status === "checked-in" && !sameDay(v._in, new Date()))) return false;

      return [v.name, v.phone, v.company, v.purpose, v._host, v._dept]
        .some(f => String(f || "").toLowerCase().includes(q));
